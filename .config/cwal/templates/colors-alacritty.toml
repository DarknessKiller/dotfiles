# Catppuccin Macchiato + dynamic accents

[colors.primary]
background = "#24273a"
foreground = "{foreground}"

[colors.cursor]
text = "#24273a"
cursor = "{color4}"

[colors.vi_mode_cursor]
text = "#24273a"
cursor = "{color5}"

[colors.search.matches]
foreground = "#24273a"
background = "{color4}"

[colors.search.focused_match]
foreground = "#24273a"
background = "{color1}"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "{color8}"
background = "#363a4f"

[colors.selection]
text = "#24273a"
background = "{color5}"

[colors.normal]
black   = "#181926"
red     = "{color1}"
green   = "{color2}"
yellow  = "{color3}"
blue    = "{color4}"
magenta = "{color5}"
cyan    = "{color6}"
white   = "{foreground}"

[colors.bright]
black   = "#363a4f"
red     = "{color9}"
green   = "{color10}"
yellow  = "{color11}"
blue    = "{color12}"
magenta = "{color13}"
cyan    = "{color14}"
white   = "{color15}"

[colors.dim]
black   = "#181926"
red     = "{color9}"
green   = "{color10}"
yellow  = "{color11}"
blue    = "{color12}"
magenta = "{color13}"
cyan    = "{color14}"
white   = "{color8}"